[package]
name = "netladder"
version = "1.0.0"
edition = "2024"
description = "Per-process download bandwidth limiter for Windows"
license = "MIT"

[dependencies]
crossbeam-channel = "0.5"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow"] }
etherparse = "0.18"
sysinfo = "0.36"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }
windivert = "0.7.0-beta.4"
windows-icons = "0.3"

[build-dependencies]
ico = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
winresource = { version = "0.1", default-features = false }

[profile.release]
strip = true
codegen-units = 1
